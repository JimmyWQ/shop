{extend name="layout/store" /}

{block name="title"}登录 · NOVA{/block}

{block name="content"}
<div class="auth-page">
    <div class="auth-visual">
        <span class="eyebrow" style="position:relative;z-index:2;">WELCOME BACK</span>
        <div class="auth-collage" aria-hidden="true">
            <div class="ac-img ac-one"><img src="/static/images/products/headphones.svg" alt=""></div>
            <div class="ac-img ac-two"><img src="/static/images/products/lamp.svg" alt=""></div>
            <div class="ac-img ac-three"><img src="/static/images/products/candle.svg" alt=""></div>
        </div>
        <div class="auth-quote">
            <h2>“生活不是等待周末，<br>而是把今天过好。”</h2>
            <p>登录你的 NOVA 账户，继续收藏那些让日常变好的小物件。</p>
        </div>
    </div>

    <div class="auth-panel">
        <div class="auth-form-wrap">
            <span class="eyebrow">SIGN IN</span>
            <h1>欢迎回来。</h1>
            <p>登录后可查看订单、保存收货信息，并继续未完成的结算。</p>

            <form class="auth-form" action="/login" method="post">
                <input type="hidden" name="_token" value="{$csrfToken}">
                <input type="hidden" name="next" value="{$next}">
                <div class="field">
                    <label for="email">邮箱</label>
                    <input id="email" type="email" name="email" value="{:form_value($old, 'email', '')}" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button class="btn btn-primary btn-block" type="submit">登录</button>
            </form>

            <div class="auth-demo">
                <strong>演示账号</strong><br>
                用户：demo@nova.test / Demo@123<br>
                管理员：admin@nova.test / Admin@123
            </div>

            <div class="auth-switch">还没有账号？<a href="/register">创建一个</a></div>
        </div>
    </div>
</div>
{/block}
